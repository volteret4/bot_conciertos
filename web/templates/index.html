<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tumtumpá</title>
<style>
:root, [data-theme="og"] {
  --bg: #0a0a14;
  --surface: #12121e;
  --surface2: #1a1a2e;
  --surface3: #22223c;
  --concert: #8b5cf6;
  --concert-dim: #3b1fa8;
  --release: #14b8a6;
  --release-dim: #0d6e66;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --border: #2d2d4e;
  --radius: 10px;
  --panel-w: 420px;

  /* alias al contrato canónico de temas compartido (tumtumpa): estas se
     definen A PARTIR de las variables originales de arriba, así que en el
     tema "og" el look no cambia un pixel. */
  --surface-2: var(--surface3);
  --accent: var(--concert);
  --accent-2: var(--release);
  --text-muted: var(--muted);
  --success: #22c55e;
  --warning: #eab308;
  --danger: #ef4444;
}


* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 24px;
}

.logo {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
  white-space: nowrap;
}
.logo span { color: var(--concert); }

.user-select-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.user-select-wrap label {
  color: var(--muted);
  font-size: 0.8rem;
  white-space: nowrap;
}

select#userSelect {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 0.9rem;
  cursor: pointer;
  min-width: 140px;
  max-width: 240px;
}
select#userSelect:focus { outline: 2px solid var(--concert); }

.view-toggle {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.view-toggle button {
  background: none;
  border: none;
  color: var(--muted);
  padding: 6px 16px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.view-toggle button.active {
  background: var(--concert);
  color: #fff;
}

/* ── MAIN ── */
#mainContent {
  padding: 28px 24px;
  max-width: 900px;
  margin: 0 auto;
  transition: padding-right 0.3s;
}

body.panel-open #mainContent {
  padding-right: calc(var(--panel-w) + 24px);
}

/* ── AGENDA ── */
.month-group { margin-bottom: 40px; }

.month-header {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}

.event-list { display: flex; flex-direction: column; gap: 6px; }

.event-card {
  display: grid;
  grid-template-columns: 52px auto 1fr;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.event-card:hover {
  background: var(--surface2);
  transform: translateX(2px);
}
.event-card.selected {
  border-color: var(--concert);
  background: var(--surface2);
}
.event-card.past { opacity: 0.55; }

.event-date {
  text-align: center;
  line-height: 1;
}
.day-num {
  display: block;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text);
}
.day-name {
  display: block;
  font-size: 0.7rem;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 2px;
}

.badge {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  white-space: nowrap;
  text-align: center;
}
.badge-concert { background: var(--concert-dim); color: #c4b5fd; }
.badge-release { background: var(--release-dim); color: #5eead4; }

.event-info { min-width: 0; }
.event-artist {
  display: block;
  font-weight: 600;
  font-size: 0.95rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.event-title {
  display: block;
  font-size: 0.82rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}
.event-sub {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  opacity: 0.7;
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── CALENDAR ── */
.calendar { user-select: none; }

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.cal-nav button {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  width: 36px;
  height: 36px;
  font-size: 1.1rem;
  cursor: pointer;
  transition: background 0.15s;
}
.cal-nav button:hover { background: var(--surface3); }
.cal-title {
  font-size: 1.1rem;
  font-weight: 600;
  text-transform: capitalize;
  letter-spacing: 0.5px;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.cal-day-header {
  text-align: center;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  padding: 6px 0;
  letter-spacing: 1px;
}

.cal-cell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 6px;
  min-height: 80px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  position: relative;
}
.cal-cell:hover { background: var(--surface2); }
.cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
.cal-cell.today { border-color: var(--concert); }
.cal-cell.has-events { cursor: pointer; }
.cal-cell.selected-day { background: var(--surface3); border-color: var(--concert); }

.cal-day-num {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
  display: block;
  margin-bottom: 4px;
}
.cal-cell.today .cal-day-num {
  background: var(--concert);
  color: #fff;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
}

.cal-dots { display: flex; flex-wrap: wrap; gap: 3px; }
.cal-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.cal-dot.concert { background: var(--concert); }
.cal-dot.release { background: var(--release); }

.cal-event-label {
  font-size: 0.65rem;
  color: var(--muted);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-event-label.concert { color: #c4b5fd; }
.cal-event-label.release { color: #5eead4; }

/* ── DAY POPUP ── */
.day-events-header {
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--muted);
}

/* ── SIDE PANEL ── */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 199;
}
body.panel-open #overlay { display: block; }

#sidePanel {
  position: fixed;
  top: 0;
  right: 0;
  width: var(--panel-w);
  height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 200;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}
body.panel-open #sidePanel { transform: translateX(0); }

.panel-hero {
  position: relative;
  height: 200px;
  background: var(--surface2);
  flex-shrink: 0;
  overflow: hidden;
}
.panel-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.6;
}
.panel-hero-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 20%, var(--surface) 100%);
}
.panel-hero-no-img {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
}

.panel-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.6);
  border: none;
  color: #fff;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  transition: background 0.15s;
}
.panel-close:hover { background: rgba(0,0,0,0.85); }

.panel-artist-name {
  position: absolute;
  bottom: 14px;
  left: 16px;
  right: 16px;
  font-size: 1.4rem;
  font-weight: 700;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  line-height: 1.2;
}

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 0 18px 20px;
}
.panel-body::-webkit-scrollbar { width: 4px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.panel-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 14px 0 12px;
}
.panel-tag {
  font-size: 0.7rem;
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 3px 10px;
  border-radius: 20px;
}

.panel-bio {
  font-size: 0.82rem;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 16px;
}

.panel-listeners {
  font-size: 0.72rem;
  color: var(--muted);
  opacity: 0.7;
  margin-top: -10px;
  margin-bottom: 14px;
}

.panel-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 16px 0;
}

.panel-event-detail {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}
.panel-detail-row {
  display: flex;
  gap: 10px;
  font-size: 0.83rem;
}
.panel-detail-label {
  color: var(--muted);
  min-width: 70px;
  flex-shrink: 0;
}
.panel-detail-value {
  color: var(--text);
  font-weight: 500;
}

.panel-ticket-btn {
  display: block;
  text-align: center;
  background: var(--concert);
  color: #fff;
  text-decoration: none;
  padding: 10px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 16px;
  transition: opacity 0.15s;
}
.panel-ticket-btn:hover { opacity: 0.85; }

.yt-embed {
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 8px;
  border: none;
  background: #000;
  margin-bottom: 10px;
}

.yt-search-btn {
  display: block;
  text-align: center;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  text-decoration: none;
  padding: 10px;
  border-radius: 8px;
  font-size: 0.82rem;
  margin-bottom: 16px;
  transition: background 0.15s;
}
.yt-search-btn:hover { background: var(--surface3); color: var(--text); }

/* ── EMPTY / LOADING ── */
.placeholder {
  text-align: center;
  color: var(--muted);
  padding: 60px 20px;
  font-size: 0.9rem;
}
.placeholder .icon { font-size: 3rem; display: block; margin-bottom: 12px; }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  :root { --panel-w: 100vw; }
  header { flex-wrap: wrap; padding: 10px 14px; }
  #mainContent { padding: 16px 12px; }
  body.panel-open #mainContent { padding-right: 12px; }
  .event-card { grid-template-columns: 44px auto 1fr; gap: 10px; }
}
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='theme-palettes.css') }}">
<style>
/* Para los 6 temas compartidos (nord/catppuccin/dracula/solarized/gruvbox/
   kanagawa), theme-palettes.css (recién cargado arriba) define --bg/
   --surface/--surface-2/--border/--text/--text-muted/--accent/--accent-2/
   --success/--warning/--danger en [data-theme="xxx"]. El resto de este
   archivo usa nombres propios (--surface2, --surface3, --concert, --release,
   --muted): los re-derivamos aquí desde los canónicos para que la cascada de
   temas los alcance también.

   Solo se aplica cuando hay un data-theme distinto de "og" (los 6 temas
   compartidos). Para "og" o sin atributo (estado inicial antes de que
   theme-picker.js aplique data-theme) NO se toca nada, y --concert/--release/
   etc conservan su valor literal del :root de arriba: así se evita una
   dependencia circular (--concert => var(--accent) => var(--concert) en el
   mismo elemento), que en CSS invalida ambas variables. */
[data-theme]:not([data-theme="og"]) {
  --surface2: var(--surface-2);
  --surface3: var(--surface-2);
  --concert: var(--accent);
  --release: var(--accent-2);
  --muted: var(--text-muted);
}
</style>

<body>

<header>
  <div class="logo">tum<span>tum</span>pá</div>
  <div class="user-select-wrap">
    <label for="userSelect">Usuario</label>
    <select id="userSelect" onchange="onUserChange(this.value)">
      <option value="">Cargando…</option>
    </select>
  </div>
  <div class="view-toggle">
    <button id="btnAgenda" class="active" onclick="switchView('agenda')">Agenda</button>
    <button id="btnCalendar" onclick="switchView('calendar')">Calendario</button>
  </div>
</header>

<div id="mainContent"></div>

<div id="overlay" onclick="closePanel()"></div>

<aside id="sidePanel">
  <div class="panel-hero" id="panelHero">
    <div class="panel-hero-no-img" id="panelHeroIcon">🎵</div>
    <img id="panelImage" src="" alt="" style="display:none" onload="this.style.display='block'" onerror="this.style.display='none'">
    <div class="panel-hero-gradient"></div>
    <button class="panel-close" onclick="closePanel()">✕</button>
    <div class="panel-artist-name" id="panelArtistName"></div>
  </div>
  <div class="panel-body">
    <div class="panel-tags" id="panelTags"></div>
    <p class="panel-bio" id="panelBio"></p>
    <p class="panel-listeners" id="panelListeners"></p>
    <hr class="panel-divider">
    <div class="panel-event-detail" id="panelEvent"></div>
    <div id="panelYt"></div>
  </div>
</aside>

<script>
// ── State ──────────────────────────────────────────────
const state = {
  users: [],
  userId: null,
  view: 'agenda',
  events: { concerts: [], releases: [] },
  calMonth: new Date(),
  selectedEvent: null,
  artistCache: {},
};

// ── Bootstrap ──────────────────────────────────────────
(async () => {
  const users = await apiFetch('/api/users');
  state.users = users || [];
  const sel = document.getElementById('userSelect');
  sel.innerHTML = '';
  if (!state.users.length) {
    sel.innerHTML = '<option value="">Sin usuarios</option>';
    showPlaceholder('No hay usuarios en la base de datos.');
    return;
  }
  state.users.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u.id;
    opt.textContent = u.username || `chat:${u.chat_id}`;
    sel.appendChild(opt);
  });
  await selectUser(state.users[0].id);
})();

// ── API helpers ────────────────────────────────────────
async function apiFetch(url) {
  try {
    const r = await fetch(url);
    return r.ok ? r.json() : null;
  } catch { return null; }
}

async function selectUser(uid) {
  state.userId = +uid;
  showPlaceholder('Cargando eventos…');
  const data = await apiFetch(`/api/user/${uid}/events`);
  state.events = data || { concerts: [], releases: [] };
  renderView();
}

function onUserChange(uid) {
  if (uid) selectUser(uid);
}

// ── View switching ─────────────────────────────────────
function switchView(v) {
  state.view = v;
  document.getElementById('btnAgenda').classList.toggle('active', v === 'agenda');
  document.getElementById('btnCalendar').classList.toggle('active', v === 'calendar');
  closePanel();
  renderView();
}

function renderView() {
  if (state.view === 'agenda') renderAgenda();
  else renderCalendar();
}

// ── Helpers ────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function dateOf(ev) {
  return ev.type === 'concert' ? ev.date : ev.release_date;
}

function allEvents() {
  const today = new Date().toISOString().slice(0, 10);
  return [
    ...state.events.concerts.map(c => ({ ...c, type: 'concert' })),
    ...state.events.releases.map(r => ({ ...r, type: 'release' })),
  ].sort((a, b) => (dateOf(a) || '').localeCompare(dateOf(b) || ''));
}

function showPlaceholder(msg) {
  document.getElementById('mainContent').innerHTML =
    `<div class="placeholder"><span class="icon">🥁</span>${esc(msg)}</div>`;
}

// ── Agenda ─────────────────────────────────────────────
function renderAgenda() {
  const events = allEvents();
  if (!events.length) { showPlaceholder('No hay eventos próximos para este usuario.'); return; }

  const groups = {};
  const today = new Date().toISOString().slice(0, 10);

  events.forEach(ev => {
    const d = dateOf(ev) || '????-??-??';
    const key = d.slice(0, 7);
    if (!groups[key]) groups[key] = [];
    groups[key].push({ ...ev, past: d < today });
  });

  let html = '';
  for (const key of Object.keys(groups).sort()) {
    const [y, m] = key.split('-');
    const label = new Date(+y, +m - 1, 1)
      .toLocaleDateString('es', { month: 'long', year: 'numeric' });
    html += `<div class="month-group">
      <h2 class="month-header">${esc(label.toUpperCase())}</h2>
      <div class="event-list">`;
    groups[key].forEach(ev => { html += eventCardHtml(ev); });
    html += `</div></div>`;
  }
  document.getElementById('mainContent').innerHTML = html;
}

function eventCardHtml(ev) {
  const d = dateOf(ev);
  const date = d ? new Date(d + 'T12:00:00') : null;
  const dayNum = date ? date.getDate().toString().padStart(2, '0') : '--';
  const dayName = date ? date.toLocaleDateString('es', { weekday: 'short' }) : '';
  const isConc = ev.type === 'concert';
  const title = isConc ? ev.concert_name : ev.release_title;
  const sub = isConc
    ? [ev.venue, ev.city, ev.country].filter(Boolean).join(', ')
    : (ev.release_type || '');
  const key = `${ev.type}-${ev.id}`;
  const pastClass = ev.past ? ' past' : '';
  return `<div class="event-card${pastClass}" id="card-${key}" onclick="openPanel('${key}')">
    <div class="event-date">
      <span class="day-num">${dayNum}</span>
      <span class="day-name">${esc(dayName)}</span>
    </div>
    <span class="badge badge-${ev.type}">${isConc ? '🎤' : '🎵'} ${isConc ? 'Concierto' : esc(ev.release_type || 'Album')}</span>
    <div class="event-info">
      <span class="event-artist">${esc(ev.artist_name)}</span>
      <span class="event-title">${esc(title || '—')}</span>
      ${sub ? `<span class="event-sub">${esc(sub)}</span>` : ''}
    </div>
  </div>`;
}

// ── Calendar ───────────────────────────────────────────
function renderCalendar() {
  const d = state.calMonth;
  const year = d.getFullYear();
  const month = d.getMonth();

  // Index events by date string
  const byDate = {};
  allEvents().forEach(ev => {
    const dateStr = dateOf(ev);
    if (!dateStr) return;
    if (!byDate[dateStr]) byDate[dateStr] = [];
    byDate[dateStr].push(ev);
  });

  const monthLabel = new Date(year, month, 1)
    .toLocaleDateString('es', { month: 'long', year: 'numeric' });

  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const offset = (firstDay + 6) % 7; // Mon=0 … Sun=6
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  let html = `<div class="calendar">
    <div class="cal-nav">
      <button onclick="calNav(-1)">&#8249;</button>
      <span class="cal-title">${esc(monthLabel)}</span>
      <button onclick="calNav(1)">&#8250;</button>
    </div>
    <div class="cal-grid">`;

  // Day headers
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(h => {
    html += `<div class="cal-day-header">${h}</div>`;
  });

  // Empty cells before first day
  for (let i = 0; i < offset; i++) {
    html += `<div class="cal-cell empty"></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayEvents = byDate[dateStr] || [];
    const isToday = dateStr === todayStr;
    const hasEv = dayEvents.length > 0;
    const classes = ['cal-cell', isToday ? 'today' : '', hasEv ? 'has-events' : ''].filter(Boolean).join(' ');
    const dayNumHtml = `<span class="cal-day-num">${day}</span>`;

    let evHtml = '';
    if (hasEv) {
      const dots = dayEvents.slice(0, 6).map(ev =>
        `<span class="cal-dot ${ev.type}"></span>`).join('');
      evHtml = `<div class="cal-dots">${dots}</div>`;

      dayEvents.slice(0, 2).forEach(ev => {
        const label = (ev.type === 'concert' ? ev.artist_name : ev.artist_name) || '';
        evHtml += `<div class="cal-event-label ${ev.type}" onclick="event.stopPropagation();openPanel('${ev.type}-${ev.id}')">${esc(label)}</div>`;
      });
      if (dayEvents.length > 2) {
        evHtml += `<div class="cal-event-label" style="opacity:0.5">+${dayEvents.length - 2} más</div>`;
      }
    }

    const clickAttr = hasEv
      ? `onclick="calDayClick('${dateStr}', event)"`
      : '';
    html += `<div class="${classes}" ${clickAttr}>${dayNumHtml}${evHtml}</div>`;
  }

  html += `</div></div>`;
  document.getElementById('mainContent').innerHTML = html;
}

function calNav(delta) {
  const d = state.calMonth;
  state.calMonth = new Date(d.getFullYear(), d.getMonth() + delta, 1);
  renderCalendar();
}

function calDayClick(dateStr, evt) {
  // If clicking directly on an event label, let its onclick fire
  if (evt && evt.target.classList.contains('cal-event-label')) return;

  const dayEvents = allEvents().filter(ev => dateOf(ev) === dateStr);
  if (dayEvents.length === 1) {
    openPanel(`${dayEvents[0].type}-${dayEvents[0].id}`);
  } else if (dayEvents.length > 1) {
    // Open the first event; could show a picker but keep it simple
    openPanel(`${dayEvents[0].type}-${dayEvents[0].id}`);
  }
}

// ── Side panel ─────────────────────────────────────────
function buildEventMap() {
  const map = {};
  allEvents().forEach(ev => { map[`${ev.type}-${ev.id}`] = ev; });
  return map;
}

async function openPanel(key) {
  const map = buildEventMap();
  const ev = map[key];
  if (!ev) return;

  // Highlight selected card in agenda
  document.querySelectorAll('.event-card.selected').forEach(el => el.classList.remove('selected'));
  const card = document.getElementById(`card-${key}`);
  if (card) card.classList.add('selected');

  state.selectedEvent = ev;
  document.body.classList.add('panel-open');

  // Reset panel
  document.getElementById('panelArtistName').textContent = ev.artist_name || '';
  document.getElementById('panelTags').innerHTML = '';
  document.getElementById('panelBio').textContent = '';
  document.getElementById('panelListeners').textContent = '';
  document.getElementById('panelYt').innerHTML = '';
  document.getElementById('panelImage').style.display = 'none';
  document.getElementById('panelHeroIcon').style.display = 'flex';
  document.getElementById('panelHeroIcon').textContent = ev.type === 'concert' ? '🎤' : '🎵';

  // Event details
  renderPanelEvent(ev);

  // Load artist info (with cache)
  const mbid = ev.artist_mbid || '';
  const cacheKey = `${ev.artist_name}|${mbid}`;
  let info = state.artistCache[cacheKey];
  if (!info) {
    const params = new URLSearchParams({ name: ev.artist_name });
    if (mbid) params.set('mbid', mbid);
    info = await apiFetch(`/api/artist/info?${params}`) || {};
    state.artistCache[cacheKey] = info;
  }

  if (info.image_url) {
    const img = document.getElementById('panelImage');
    img.src = info.image_url;
    img.style.display = 'block';
    document.getElementById('panelHeroIcon').style.display = 'none';
  }

  if (info.tags && info.tags.length) {
    document.getElementById('panelTags').innerHTML =
      info.tags.map(t => `<span class="panel-tag">${esc(t)}</span>`).join('');
  }

  if (info.bio) {
    document.getElementById('panelBio').textContent = info.bio;
  }

  if (info.listeners) {
    document.getElementById('panelListeners').textContent =
      `${Number(info.listeners).toLocaleString('es')} oyentes en Last.fm`;
  }

  // YouTube
  renderPanelYt(ev);
}

function renderPanelEvent(ev) {
  const el = document.getElementById('panelEvent');
  if (ev.type === 'concert') {
    const rows = [
      ['Fecha', fmtDate(ev.date)],
      ev.time ? ['Hora', ev.time] : null,
      ev.concert_name !== ev.artist_name ? ['Evento', ev.concert_name] : null,
      ev.venue ? ['Sala', ev.venue] : null,
      ev.city ? ['Ciudad', [ev.city, ev.country].filter(Boolean).join(', ')] : null,
      ev.source ? ['Fuente', ev.source] : null,
    ].filter(Boolean);
    el.innerHTML = rows.map(([l, v]) =>
      `<div class="panel-detail-row">
        <span class="panel-detail-label">${esc(l)}</span>
        <span class="panel-detail-value">${esc(v)}</span>
      </div>`
    ).join('');
    if (ev.url) {
      el.innerHTML += `<a class="panel-ticket-btn" href="${esc(ev.url)}" target="_blank" rel="noopener">
        🎟 Ver entradas
      </a>`;
    }
  } else {
    const rows = [
      ['Fecha', fmtDate(ev.release_date)],
      ev.release_type ? ['Tipo', ev.release_type] : null,
      ev.release_title ? ['Título', ev.release_title] : null,
    ].filter(Boolean);
    el.innerHTML = rows.map(([l, v]) =>
      `<div class="panel-detail-row">
        <span class="panel-detail-label">${esc(l)}</span>
        <span class="panel-detail-value">${esc(v)}</span>
      </div>`
    ).join('');
  }
}

function renderPanelYt(ev) {
  const el = document.getElementById('panelYt');
  const ytUrl = ev.yt_url || null;
  if (ytUrl) {
    const m = ytUrl.match(/(?:v=|youtu\.be\/)([^&?/]+)/);
    if (m) {
      el.innerHTML = `<iframe class="yt-embed"
        src="https://www.youtube.com/embed/${m[1]}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>`;
      return;
    }
  }
  // Fallback: search link
  const q = encodeURIComponent(`${ev.artist_name} ${ev.type === 'concert' ? 'live' : (ev.release_title || '')}`);
  el.innerHTML = `<a class="yt-search-btn" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">
    ▶ Buscar en YouTube
  </a>`;
}

function closePanel() {
  document.body.classList.remove('panel-open');
  document.querySelectorAll('.event-card.selected').forEach(el => el.classList.remove('selected'));
  // Stop YT playback
  document.getElementById('panelYt').innerHTML = '';
  state.selectedEvent = null;
}
</script>
